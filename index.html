    <script>
      const nativeParseInt = window.parseInt;
      const dueDateMonthNumbers = {
        jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6,
        jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12
      };
      window.parseInt = (value, radix) => {
        if (radix === 10 && typeof value === "string") {
          const month = dueDateMonthNumbers[value.trim().slice(0, 3).toLowerCase()];
          if (month) return month;
        }
        return nativeParseInt(value, radix);
      };
    </script>

      if (!window.qapPdfRemove) {

          if (!confirm('ยืนยันลบไฟล์ PDF ใบรับรองนี้ออกจากระบบและฐานข้อมูล Supabase ใช่หรือไม่?')) return;
          if (!instrument) return;
          const histList = Array.isArray(instrument.history) && instrument.history.length > 0 
              ? instrument.history 
              : Array.isArray(instrument.calibrationHistory) && instrument.calibrationHistory.length > 0 
              ? instrument.calibrationHistory 
              : [];
          const newHistory = histList.map(h => 
              (h.id === histId || (!histId && histList.length <= 1)) ? { ...h, certFileData: null, certFileName: null, pdfUrl: null, fileSize: null } : h
          );
          const isCurrent = !histId || (histList.length > 0 && histList[0].id === histId);
          const updated = {
            ...instrument,
            history: newHistory,
            calibrationHistory: newHistory,
            ...(isCurrent ? { certFileData: null, certFileName: null, pdfUrl: null, fileSize: null } : {})
          };
          if (typeof onUpdate === 'function') {
            onUpdate(updated);

          if (typeof window.qapOpenDocViewer === 'function') {
              window.qapOpenDocViewer({ pdfUrl: base64, certFileData: base64, certNo: certNo || 'CERT-PDF' }, instrument || {});
          } else {
              try {
                  const parts = (base64 || '').split(',');
                  const mime = (parts[0] && parts[0].match(/:(.*?);/)) ? parts[0].match(/:(.*?);/)[1] : 'application/pdf';
                  const bstr = atob(parts[1] || '');
                  let n = bstr.length;
                  const u8arr = new Uint8Array(n);
                  while (n--) u8arr[n] = bstr.charCodeAt(n);
                  const blob = new Blob([u8arr], { type: mime });
                  const blobUrl = URL.createObjectURL(blob);
                  window.open(blobUrl, '_blank');
              } catch(e) {
                  const win = window.open();
                  if (win) {
                      win.document.write('<iframe src="' + base64 + '" frameborder="0" style="border:0; width:100%; height:100vh;" allowfullscreen></iframe>');

        const getVal = (id, fallback) => {
          const el = document.getElementById(id);
          return el ? el.value.trim() : fallback;
        };

        const doc0 = {
          ...defaultPage2Doc,
          code: getVal('doc0-code', defaultPage2Doc.code),
          ts: getVal('doc0-ts', defaultPage2Doc.ts),
          rev: getVal('doc0-rev', defaultPage2Doc.rev),
          retention: getVal('doc0-retention', defaultPage2Doc.retention),
          name: getVal('doc0-name', defaultPage2Doc.name),
          prepared: getVal('doc0-prepared', defaultPage2Doc.prepared),
          approved: getVal('doc0-approved', defaultPage2Doc.approved)
        };

        const doc1 = {
          ...defaultPage3Doc,
          code: getVal('doc1-code', defaultPage3Doc.code),
          ts: getVal('doc1-ts', defaultPage3Doc.ts),
          retention: getVal('doc1-retention', defaultPage3Doc.retention),
          name: getVal('doc1-name', defaultPage3Doc.name),
          company: getVal('doc1-company', defaultPage3Doc.company),
          issueDate: getVal('doc1-issueDate', defaultPage3Doc.issueDate),
          prepared: getVal('doc1-prepared', defaultPage3Doc.prepared),
          approved: getVal('doc1-approved', defaultPage3Doc.approved),
          rev: getVal('doc1-rev', defaultPage3Doc.rev)
        };

        return [doc0, doc1];
      }

      // Live Preview Button handlers
      modal.querySelectorAll('.qap-doc-preview-btn').forEach(btn => {
        btn.onclick = (e) => {
          const docType = e.currentTarget.getAttribute('data-doc-type');
          const currentValues = gatherFormInputs();
          openPreviewModal(docType, currentValues);
        };
      });

      // Link Buttons Action
      modal.querySelectorAll('.qap-doc-link-btn').forEach(btn => {
        btn.onclick = (e) => {
          const type = e.currentTarget.getAttribute('data-doc-type');
          const updated = gatherFormInputs();
          saveDocs(updated);
          closeModal();

          if (type === 'card') {
            const firstControlBtn = document.querySelector('button[title*="MEASURING INSTRUMENT CONTROL CARD"], button[title*="Control Card"], button[title*="XLSX"]');
            if (firstControlBtn) {
              firstControlBtn.click();
            } else {
              alert(`🔗 เชื่อมต่อหน้าที่ 2: [MEASURING INSTRUMENT CONTROL CARD]\nบันทึกและอัปเดตรหัส (${updated[0].code} ${updated[0].ts}) เข้าสู่แบบฟอร์มเรียบร้อยแล้ว!`);
            }
          } else if (type === 'master') {
            const exportBtn = document.querySelector('button[title*="Export"], button[title*="Excel"]');
            if (exportBtn) {
              exportBtn.click();
            } else {
              alert(`🔗 เชื่อมต่อหน้าที่ 3: [${updated[1].name}]\nบันทึกและอัปเดตรหัส (${updated[1].code}) เข้าสู่ระบบเรียบร้อยแล้ว!`);
            }
          }
        };
      });

      // Save Button Action
      document.getElementById('qap-modal-save-btn').onclick = () => {
        const updated = gatherFormInputs();
        saveDocs(updated);
        const statusEl = document.getElementById('qap-modal-status');
        if (statusEl) {
          statusEl.textContent = '✨ บันทึกสำเร็จ! ข้อมูลถูกเชื่อมโยงไปยังแบบฟอร์มหน้าที่ 2 และหน้าที่ 3 เรียบร้อยแล้ว';
        }
        setTimeout(() => {
          closeModal();
          window.location.reload();
        }, 1200);
      };
    }

    // STRICT SINGLE BOTTOM-MOST BUTTON ENFORCEMENT
    function placeSingleBottomButton() {
      const allButtons = document.querySelectorAll('#qap-sidebar-doc-btn, .qap-doc-btn-injected');
      const sidebar = document.querySelector('aside') || document.querySelector('[class*="sidebar"]');

      if (!sidebar) return;

      if (!sidebar.classList.contains('flex')) {
        sidebar.style.display = 'flex';
        sidebar.style.flexDirection = 'column';
      }

      if (allButtons.length === 1 && sidebar.contains(allButtons[0])) {
        const btn = allButtons[0];
        btn.style.marginTop = 'auto';
        btn.style.marginBottom = '16px';
        btn.style.marginLeft = '12px';
        btn.style.marginRight = '12px';
        btn.style.width = 'calc(100% - 24px)';
        if (sidebar.lastElementChild !== btn) {
          sidebar.appendChild(btn);
        }
        return;
      }

      allButtons.forEach(b => b.remove());

      const btn = document.createElement('button');
      btn.id = 'qap-sidebar-doc-btn';
      btn.className = 'qap-doc-btn-injected flex items-center gap-3 px-3.5 py-3 rounded-xl text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 transition shadow-lg cursor-pointer text-left group shrink-0';
      btn.style.marginTop = 'auto';
      btn.style.marginBottom = '16px';
      btn.style.marginLeft = '12px';
      btn.style.marginRight = '12px';
      btn.style.width = 'calc(100% - 24px)';
      btn.title = 'Document Version & TS Control Database';
      btn.innerHTML = `
        <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center text-white shrink-0 font-bold text-lg">📑</div>
        <div class="truncate">
          <div class="text-[13px] font-bold tracking-tight text-white leading-tight">Document Control DB</div>
          <div class="text-[10px] text-blue-200 mt-0.5 leading-tight">เชื่อมหน้าที่ 2 & 3 อัตโนมัติ</div>
        </div>
      `;
      btn.onclick = openDocModal;
      sidebar.appendChild(btn);
    }

    let timer = null;
    const observer = new MutationObserver(() => {
      if (timer) clearTimeout(timer);
      timer = setTimeout(placeSingleBottomButton, 150);
    });

    if (document.body) {
      observer.observe(document.body, { childList: true, subtree: true });
    } else {
      document.addEventListener('DOMContentLoaded', () => {
        observer.observe(document.body, { childList: true, subtree: true });
      });
    }

    placeSingleBottomButton();
    window.openQapDocumentControlModal = openDocModal;
  })();
</script>
</body></html>
