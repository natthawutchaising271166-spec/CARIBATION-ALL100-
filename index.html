    <script>
      const nativeParseInt = window.parseInt;
      const dueDateMonthNumbers = {
        jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6,
        jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12
      };
      window.parseInt = (value, radix) => {
        if (radix === 10 && typeof value === "string") {
          const month = dueDateMonthNumbers[value.trim().slice(0, 3).toLowerCase()];
          if (month) return month;
        }
        return nativeParseInt(value, radix);
      };
    </script>

    <script>
      (() => {
        const removeCertificateButtons = () => {
          document.querySelectorAll("button").forEach((button) => {
            const label = `${button.title} ${button.textContent}`;
            if (label.includes("พิมพ์ใบรับรอง") || label.includes("สติ๊กเกอร์") || button.querySelector(".lucide-file-text")) button.remove();
          });
          const walker = document.createTreeWalker(document.getElementById("root"), NodeFilter.SHOW_TEXT);
          const textNodes = [];
          while (walker.nextNode()) textNodes.push(walker.currentNode);
          textNodes.forEach((node) => { node.nodeValue = node.nodeValue.replace(/Y2026/g, ""); });
          document.querySelectorAll("[title]").forEach((element) => { element.title = element.title.replace(/Y2026/g, ""); });
        };
        new MutationObserver(removeCertificateButtons).observe(document.getElementById("root"), { childList: true, subtree: true });
        removeCertificateButtons();
      })();
    </script>

    <script>
      window.qapPdfUpload = (e, histId, instrument, onUpdate) => {
          const file = e.target.files[0];
          if(!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
              const base64 = ev.target.result;
              const newHistory = instrument.history.map(h => 
                  h.id === histId ? { ...h, certFileData: base64, certFileName: file.name } : h
              );
              onUpdate({ ...instrument, history: newHistory });
          };
          reader.readAsDataURL(file);
      };

      window.qapPdfRemove = (histId, instrument, onUpdate) => {
          if(!confirm('ยืนยันลบไฟล์ PDF นี้หรือไม่?')) return;
          const newHistory = instrument.history.map(h => 
              h.id === histId ? { ...h, certFileData: null, certFileName: null } : h
          );
          onUpdate({ ...instrument, history: newHistory });
      };

      window.qapPdfView = (base64) => {
          const win = window.open();
          if(win) {
              win.document.write('<iframe src="' + base64 + '" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>');
              win.document.title = 'Certificate PDF';
          } else {
              alert('กรุณาอนุญาต Pop-ups เพื่อดูไฟล์ PDF');
          }
      };
    </script>
